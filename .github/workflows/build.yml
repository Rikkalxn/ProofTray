name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Install Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Debug APK and run JVM tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Collect APK, bundled notices and corresponding source
        shell: bash
        run: |
          mkdir -p dist/ci/licenses
          apk=dist/ci/ProofTray-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          unzip -jq "$apk" 'assets/licenses/*' -d dist/ci/licenses
          git ls-files --recurse-submodules -z |
            tar --create --gzip --file=dist/ci/ProofTray-source.tar.gz --no-recursion --null --files-from=-

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ProofTray-debug-${{ github.run_number }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Upload JVM test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  core:
    name: C++ core and Log TIFF tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the TIFF dependency
        run: git submodule update --init -- third_party/libtiff/upstream

      - name: Configure C++ core
        run: >-
          cmake -S . -B out/build/ci-core -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DOPENBRIDGE_BUILD_TESTS=ON -DOPENBRIDGE_BUILD_TIFF_TESTS=ON

      - name: Build C++ core
        run: cmake --build out/build/ci-core --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir out/build/ci-core --no-tests=error --output-on-failure --output-junit test-results.xml

      - name: Upload C++ test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-test-reports-${{ github.run_number }}
          path: |
            out/build/ci-core/test-results.xml
            out/build/ci-core/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
